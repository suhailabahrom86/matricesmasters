  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseDB = null;
    window.FirestoreOps = { collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc };

    async function initFirebase() {
      try {
        const firebaseConfig = window.__firebase_config;

        if (!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.projectId) {
          throw new Error("Missing Firebase configuration. Ensure matrices-firebase-config.js is uploaded beside index.html.");
        }

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);
        window.FirebaseDB = db;

        console.log("Firebase project:", firebaseConfig.projectId);
        console.log("Firestore collection: chapter6Results");

        if (window.app) {
          window.app.subscribeRealtimeLeaderboard();
        } else {
          window.__pendingCloudStatus = 'connected';
        }
      } catch (err) {
        console.error("Firebase initialization error:", err);
        setCloudState('local');
      }
    }

    function setCloudState(status) {
      if (window.app) {
        window.app.setCloudStatus(status);
      } else {
        window.__pendingCloudStatus = status;
      }
    }

    initFirebase();
  </script>

    class MatricesMastersApp {
      constructor() {
        this.currentView = 'landing';
        this.student = { name: '', section: '821' };
        this.quizState = {
          currentIndex: 0,
          answers: new Array(10).fill(null),
          submitted: new Array(10).fill(false),
          startTime: null,
          endTime: null,
          elapsedSeconds: 0,
          timerInterval: null
        };
        this.cloudStatus = 'connecting'; // 'connected', 'connecting', 'local'
        this.teacherAuthenticated = false;
        this.teacherSectionFilter = 'ALL';
        this.allFirestoreRecords = []; // All raw documents loaded from Firestore
        this.leaderboardData = []; // Processed Best Attempts per student
        this.loginAttempts = 0;
        this.lockoutUntil = null;
        this.unsubscribeLeaderboard = null; // Prevent duplicate Firestore listeners
      }

      init() {
        if (window.__pendingCloudStatus) {
          this.setCloudStatus(window.__pendingCloudStatus);
        }
        if (window.FirebaseDB) {
          this.subscribeRealtimeLeaderboard();
        }
        this.render();
      }

      getCollectionRef() {
        if (!window.FirebaseDB) return null;
        const { collection } = window.FirestoreOps;
        return collection(window.FirebaseDB, 'chapter6Results');
      }

      setCloudStatus(status) {
        this.cloudStatus = status;
        const badge = document.getElementById('cloud-status-badge');
        const text = document.getElementById('cloud-status-text');
        
        if (!badge || !text) return;

      triggerKaTeX(targetNode) {
        const container = targetNode || document.getElementById('app-viewport') || document.body;
        
        if (window.renderMathInElement) {
          try {
            window.renderMathInElement(container, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\(', right: '\\)', display: false },
                { left: '\\[', right: '\\]', display: true }
              ],
              throwOnError: false,
              ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
            });
          } catch (e) {
            console.error("KaTeX Auto-render Error:", e);
          }
        } else if (window.katex) {
          container.querySelectorAll('.math-render').forEach(el => {
            try {
              const latex = el.getAttribute('data-latex') || el.textContent;
              window.katex.render(latex, el, {
                displayMode: el.classList.contains('math-display'),
                throwOnError: false
              });
            } catch (e) {
              console.error("KaTeX Error:", e);
            }
          });
        }
      }

      startQuizChallenge() {
        this.quizState = {
          currentIndex: 0,
          answers: new Array(10).fill(null),
          submitted: new Array(10).fill(false),
          startTime: new Date(),
          endTime: null,
          elapsedSeconds: 0,
          timerInterval: null
        };

        this.startTimer();
        this.navigateTo('quiz');
      }

      startTimer() {
        if (this.quizState.timerInterval) clearInterval(this.quizState.timerInterval);
        this.quizState.timerInterval = setInterval(() => {
          this.quizState.elapsedSeconds++;
          const timerEl = document.getElementById('quiz-timer');
          if (timerEl) {
            timerEl.textContent = this.formatDuration(this.quizState.elapsedSeconds);
          }
        }, 1000);
      }

      stopTimer() {
        if (this.quizState.timerInterval) {
          clearInterval(this.quizState.timerInterval);
          this.quizState.timerInterval = null;
        }
      }

      formatDuration(sec) {
        const mins = Math.floor(sec / 60);
        const secs = sec % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      selectOption(optionIndex) {
        if (this.quizState.submitted[this.quizState.currentIndex]) return; // Locked
        this.quizState.answers[this.quizState.currentIndex] = optionIndex;
        this.render();
      }

      submitCurrentAnswer() {
        const idx = this.quizState.currentIndex;
        if (this.quizState.answers[idx] === null) return;
        this.quizState.submitted[idx] = true;
        this.render();
      }

      prevQuestion() {
        if (this.quizState.currentIndex > 0) {
          this.quizState.currentIndex--;
          this.render();
        }
      }

      nextQuestion() {
        if (this.quizState.currentIndex < 9) {
          this.quizState.currentIndex++;
          this.render();
        } else {
          this.finishAssessment();
        }
      }

      finishAssessment() {
        this.stopTimer();
        this.quizState.endTime = new Date();
        this.saveResultToFirestore();
        this.navigateTo('results');
      }

      handleTeacherLogin(e) {
        e.preventDefault();

        if (this.lockoutUntil && Date.now() < this.lockoutUntil) {
          this.showTeacherAccessModal();
          return;
        }

        const codeInput = document.getElementById('teacher-code-input');
        const code = codeInput ? codeInput.value : '';
        const errorMsg = document.getElementById('teacher-error-msg');
        const errorText = document.getElementById('teacher-error-text');
        
        // Exact case-sensitive access verification
        if (code === "suhailabahrom") {
          this.teacherAuthenticated = true;
          this.loginAttempts = 0;
          this.lockoutUntil = null;
          this.closeModal();
          this.navigateTo('teacher');
        } else {
          this.loginAttempts++;
          if (this.loginAttempts >= 5) {
            this.lockoutUntil = Date.now() + 60000;
            this.loginAttempts = 0;
            this.showTeacherAccessModal();
          } else {
            if (errorMsg) errorMsg.classList.remove('hidden');
            if (errorText) errorText.textContent = `Incorrect access code. Teacher access denied. (${5 - this.loginAttempts} attempts left)`;
            if (codeInput) {
              codeInput.value = '';
              codeInput.focus();
            }
          }
        }
      }

      calculateItemAnalysis(records) {
        return QUESTION_BANK.map((q, idx) => {
          let correctCount = 0;
          let incorrectCount = 0;

          records.forEach(attempt => {
            if (attempt.questionResults && Array.isArray(attempt.questionResults) && attempt.questionResults[idx] !== undefined) {
              if (attempt.questionResults[idx]) correctCount++;
              else incorrectCount++;
            } else if (attempt.score !== undefined) {
              if (attempt.score >= idx + 1) correctCount++;
              else incorrectCount++;
            }
          });

          const total = correctCount + incorrectCount;
          const passPct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

          let status = "PRIORITY MISCONCEPTION";
          let badgeClass = "bg-coral-light text-coral-dark border border-coral/30";

          if (passPct >= 80) {
            status = "MASTERED";
            badgeClass = "bg-teal-light text-teal border border-teal/30";
          } else if (passPct >= 60) {
            status = "DEVELOPING";
            badgeClass = "bg-amber-light text-amber-dark border border-amber/30";
          }

          return { topic: q.topic, correctCount, incorrectCount, passPct, status, badgeClass };
        });
      }

      handleSectionFilterChange(val) {
        this.teacherSectionFilter = val;
        this.render();
      }

      confirmClearLeaderboard() {
        if (!this.teacherAuthenticated) {
          this.showTeacherAccessModal();
          return;
        }

        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content');

        modalContent.innerHTML = `
          <div class="space-y-5">
            <div class="w-12 h-12 rounded-2xl bg-coral-light text-coral flex items-center justify-center mx-auto text-xl">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <div class="text-center space-y-2">
              <h3 class="text-lg font-black text-gray-900">Confirm Clear Leaderboard</h3>
              <p class="text-xs text-gray-600 font-medium leading-relaxed">
                Are you sure you want to permanently clear all Chapter 6 leaderboard records?
              </p>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button onclick="app.closeModal()" class="py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs transition-all">
                CANCEL
              </button>
              <button onclick="app.executeClearLeaderboard()" class="py-3 rounded-xl bg-coral hover:bg-coral-dark text-white font-bold text-xs shadow-md shadow-coral/20 transition-all">
                YES, CLEAR LEADERBOARD
              </button>
            </div>
          </div>
        `;

        modalContainer.classList.remove('hidden');
      }

      async executeClearLeaderboard() {
        this.closeModal();
        if (!this.teacherAuthenticated) return;

        await this.clearFirestoreLeaderboard();
      }

      // ----------------------------------------------------------------
      // FIRESTORE CLOUD DATABASE ACTIONS
      // ----------------------------------------------------------------
      async saveResultToFirestore() {
        const total = 10;
        let score = 0;
        const qResults = this.quizState.answers.map((ans, i) => {
          const isCorrect = ans === QUESTION_BANK[i].correct;
          if (isCorrect) score++;
          return isCorrect;
        });

        const normName = normaliseStudentName(this.student.name || 'ANONYMOUS');
        const normSec = normaliseSection(this.student.section || '821');

        const record = {
          studentName: (this.student.name || 'ANONYMOUS').trim().toUpperCase(),
          studentNameNormalised: normName,
          section: normSec,
          score: score,
          totalQuestions: total,
          percentage: Math.round((score / total) * 100),
          correctCount: score,
          incorrectCount: total - score,
          durationSeconds: this.quizState.elapsedSeconds,
          answers: this.quizState.answers,
          questionResults: qResults,
          completedAt: window.FirestoreOps && window.FirestoreOps.serverTimestamp ? window.FirestoreOps.serverTimestamp() : new Date().toISOString()
        };

        if (window.FirebaseDB) {
          try {
            const { addDoc } = window.FirestoreOps;
            const colRef = this.getCollectionRef();
            const docRef = await addDoc(colRef, record);
            console.log("Student saved successfully to chapter6Results:", docRef.id);
          } catch (err) {
            console.error("Firestore Save Error:", err);
          }
        }
      }

      subscribeRealtimeLeaderboard() {
        if (!window.FirebaseDB) return;

        // Create only ONE realtime Firestore listener.
        if (this.unsubscribeLeaderboard) return;

        const { onSnapshot } = window.FirestoreOps;
        const colRef = this.getCollectionRef();
        if (!colRef) return;

        try {
          this.unsubscribeLeaderboard = onSnapshot(colRef, (snapshot) => {
            this.setCloudStatus('connected');

            const records = [];
            snapshot.forEach(doc => {
              const data = doc.data() || {};
              const rawName = data.studentName || data.name || 'ANONYMOUS';
              const normName = data.studentNameNormalised || normaliseStudentName(rawName);
              const section = normaliseSection(data.section || data.studentSection || '821');
              const score = Number(data.score ?? data.correctCount ?? data.correct ?? 0);
              const durationSeconds = Number(data.durationSeconds ?? data.duration ?? 0);
              const totalQuestions = Number(data.totalQuestions || 10);
              const percentage = Number(data.percentage ?? Math.round((score / totalQuestions) * 100));

              records.push({
                id: doc.id,
                ...data,
                studentName: String(rawName).trim().toUpperCase(),
                studentNameNormalised: normName,
                section: section,
                score: score,
                durationSeconds: durationSeconds,
                totalQuestions: totalQuestions,
                percentage: percentage
              });
            });

            console.log("chapter6Results records loaded:", records);
            this.allFirestoreRecords = records;
            this.processLeaderboardData();

            if (this.currentView === 'teacher') {
              this.render();
            }
          }, (error) => {
            console.error("Firestore onSnapshot failed:", error);
            this.setCloudStatus('local');
            this.unsubscribeLeaderboard = null;
          });
        } catch (err) {
          console.error("Realtime subscription error:", err);
          this.setCloudStatus('local');
          this.unsubscribeLeaderboard = null;
        }
      }

      processLeaderboardData() {
        const bestMap = new Map();

        (this.allFirestoreRecords || []).forEach(item => {
          const key = `${item.studentNameNormalised}|${item.section}`;
          if (!bestMap.has(key)) {
            bestMap.set(key, item);
          } else {
            const existing = bestMap.get(key);
            // Best attempt logic: higher score, or equal score with faster duration
            if (item.score > existing.score || (item.score === existing.score && item.durationSeconds < existing.durationSeconds)) {
              bestMap.set(key, item);
            }
          }
        });

        this.leaderboardData = Array.from(bestMap.values()).sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return (a.durationSeconds || 0) - (b.durationSeconds || 0);
        });
      }

      async clearFirestoreLeaderboard() {
        if (!window.FirebaseDB) {
          this.showNotificationModal("Cloud leaderboard could not be cleared. Please check Firestore permissions.", "error");
          return;
        }
        
        const { getDocs, deleteDoc } = window.FirestoreOps;
        const colRef = this.getCollectionRef();

        try {
          const snapshot = await getDocs(colRef);
          const deletePromises = snapshot.docs.map(d => deleteDoc(d.ref));
          await Promise.all(deletePromises);
          
          this.allFirestoreRecords = [];
          this.leaderboardData = [];
          this.render();
          this.showNotificationModal("Leaderboard cleared successfully.", "success");
        } catch (err) {
          console.error("Error clearing leaderboard:", err);
          this.showNotificationModal("Cloud leaderboard could not be cleared. Please check Firestore permissions.", "error");
        }
      }

      showNotificationModal(message, type = "info") {
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content');

        const icon = type === "success" 
          ? '<div class="w-12 h-12 rounded-2xl bg-teal-light text-teal flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-circle-check"></i></div>'
          : '<div class="w-12 h-12 rounded-2xl bg-coral-light text-coral flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-circle-exclamation"></i></div>';

        modalContent.innerHTML = `
          <div class="space-y-5 text-center">
            ${icon}
            <div class="text-sm font-bold text-gray-800">${message}</div>
            <button onclick="app.closeModal()" class="w-full py-3 rounded-xl bg-teal text-white font-bold text-xs shadow-md">
              OK
            </button>
          </div>
        `;

        modalContainer.classList.remove('hidden');
      }
    }

    // Initialize application on DOM ready
    window.onload = function() {
      window.app = new MatricesMastersApp();
      window.app.init();
    };
  </script>
